services:
  - type: web
    name: scriptforge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: YOUTUBE_API_KEY
        sync: false          # Optional: YouTube Data API v3 key
      - key: SCRAPER_API_KEY
        sync: false          # Optional: ScraperAPI key for transcript proxies
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
    healthCheckPath: /health
    autoDeploy: true
